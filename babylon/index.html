<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Second Person Shooter (Babylon.js)</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b120e; overflow: hidden; }
      canvas#game { width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
      #loading {
        position: fixed; inset: 0; display: grid; place-items: center;
        color: #8fe3a8; font: 18px/1.4 ui-monospace, monospace; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="loading">loading… (click the game to focus, then arrows + space)</div>
    <canvas id="game" tabindex="0"></canvas>
    <script type="module" src="/src/main.ts"></script>
    <script>
      const canvas = document.getElementById("game");
      canvas.addEventListener("pointerdown", () => canvas.focus());
    </script>
  </body>
</html>
