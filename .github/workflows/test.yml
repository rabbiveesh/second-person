name: Test

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libasound2-dev libwayland-dev libxkbcommon-dev
      # Installs exactly what rust-toolchain.toml pins (rustup no longer auto-installs).
      - name: Install Rust
        run: rustup toolchain install
      # .cargo/config.toml links with clang + mold.
      - uses: rui314/setup-mold@v1
      # Shared with the duel server deploy, which builds the same profile and features. Only main
      # saves: PR caches would each eat into the repo's 10 GB, and PRs restore main's anyway.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Headless gameplay tests
        run: cargo test --no-default-features --features ci
