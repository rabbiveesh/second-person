# Deploy the playable game to GitHub Pages.
# Bevy -> wasm via Trunk (handles wasm-bindgen + wasm-opt + index.html).
name: Deploy game to Pages

on:
  push:
    branches: ["main"]
    paths-ignore:
      - '*.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # .cargo/config.toml links host build scripts with clang + mold.
      - name: Install mold
        uses: rui314/setup-mold@v1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Build WASM
        # Relative public URL so it works under /<repo>/ on Pages.
        run: trunk build --release --public-url ./

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
