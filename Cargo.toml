[package]
name = "second_person"
version = "0.1.0"
edition = "2024"

[dependencies]
avian3d = "0.7"
bevior_tree = { version = "0.11", default-features = false }
# bevy_audio is off: bevy_kira_audio replaces it.
bevy = { version = "0.19.1", default-features = false, features = ["3d", "ui"] }
bevy_egui = "0.40"
bevy-inspector-egui = { version = "0.37", optional = true }
bevy_firework = "0.10"
bevy_kira_audio = { version = "0.26", default-features = false, features = ["wav"] }
leafwing-input-manager = "0.21"
virtual_joystick = { version = "2.8", default-features = false }
rand = "0.9"
earcut = "0.4"
bevy_brp_extras = { version = "0.22", optional = true }
vleue_navigator = { version = "0.16", default-features = false, features = ["avian3d"] }

[features]
default = ["dev"]
# Fast iteration: dynamically link bevy. Disable for release builds (`--no-default-features`).
dev = ["bevy/dynamic_linking", "inspector", "brp"]
# F1 world inspector. Off in release/web builds unless asked for.
inspector = ["dep:bevy-inspector-egui"]
# Bevy Remote Protocol on :15702 (+ extras: screenshots, key input) so tools/agents can
# inspect and drive the running game. Pair with `bevy_brp_mcp` (see .mcp.json).
brp = ["dep:bevy_brp_extras", "bevy/png"]

# Optimise deps even in dev; our own crate stays fast to compile.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# wasm: getrandom needs to be told to use the browser's crypto API.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

# bevy_firework 0.10.0 + a fix so particles work with MSAA on WebGL2: without a depth prepass
# it bound a multisampled dummy depth texture, which WebGL2 can't create (panicked on the
# first particle burst). Upstream PR: https://github.com/mbrea-c/bevy_firework/pull/59 (drop when released).
[patch.crates-io]
bevy_firework = { path = "vendor/bevy_firework" }

[dev-dependencies]
hound = "3.5.1"
sfxr = "0.1"

# Web release: small and fast. Used by Trunk (see index.html).
[profile.wasm-release]
inherits = "release"
opt-level = "s"
# Decision (2026-10-05): fat LTO, deliberately. Measured warm rebuilds: thin 160s / 15.2MB gz
# vs fat 354s / 12.3MB gz. Only Pages deploys pay the extra ~3 min; the dev loop (dev profile)
# never uses this profile, so we take the smaller download.
lto = "fat"
codegen-units = 1
strip = "debuginfo"
