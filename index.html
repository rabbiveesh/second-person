<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Second Person Shooter</title>
    <link data-trunk rel="rust" data-cargo-no-default-features data-cargo-profile="wasm-release" data-wasm-opt="z" />
    <link data-trunk rel="copy-dir" href="assets" />
    <style>
      html, body { margin: 0; height: 100%; background: #0b120e; overflow: hidden; }
      /* The game owns every touch: no scroll, pinch-zoom, pull-to-refresh, long-press menu or text selection. */
      html, body { overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      canvas#game { width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
      #loading {
        position: fixed; inset: 0; display: grid; place-items: center;
        color: #8fe3a8; font: 18px/1.4 ui-monospace, monospace; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="loading">loading… (keyboard: click, then arrows + space · touch: left thumb drives, tap right to fire)</div>
    <canvas id="game" tabindex="0"></canvas>
    <script>
      // Hide the loading note once Bevy starts drawing, and keep keyboard focus on the canvas.
      const canvas = document.getElementById("game");
      const loading = document.getElementById("loading");
      new ResizeObserver(() => { if (canvas.width > 0) loading.remove(); }).observe(canvas);
      canvas.addEventListener("pointerdown", () => canvas.focus());
    </script>
  </body>
</html>
